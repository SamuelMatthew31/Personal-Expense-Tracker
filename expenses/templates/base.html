<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Expense Tracker{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #F6F5F0;
    --color-surface: #FFFFFF;
    --color-ink: #16241D;
    --color-ink-soft: #5B6B62;
    --color-primary: #1F6F54;
    --color-primary-dark: #12503B;
    --color-accent: #C9A227;
    --color-border: #DFE3DC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--color-border);
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--color-ink);
  }

  nav a, nav button {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--color-ink-soft);
    text-decoration: none;
    margin-left: 1.25rem;
    background: none;
    border: none;
    cursor: pointer;
  }

  nav a:hover, nav button:hover { color: var(--color-primary); }

  main { min-height: calc(100vh - 65px); }

  /* Auth split layout */
  .auth-shell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: calc(100vh - 65px);
  }

  .auth-brand-panel {
    background: var(--color-primary-dark);
    color: #EFF3EF;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem;
    position: relative;
    overflow: hidden;
  }

  .auth-brand-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 39px,
      rgba(255,255,255,0.045) 40px
    );
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 1rem;
  }

  .auth-brand-panel h1 {
    font-family: 'Fraunces', serif;
    font-size: 3rem;
    font-weight: 600;
    line-height: 1.05;
    margin: 0 0 1.25rem 0;
  }

  .auth-brand-panel p {
    color: #C7D3CB;
    max-width: 32ch;
    font-size: 0.98rem;
  }

  .auth-form-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .auth-form-card {
    width: 100%;
    max-width: 380px;
  }

  .auth-form-card h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  .auth-subtitle {
    color: var(--color-ink-soft);
    font-size: 0.92rem;
    margin-bottom: 2rem;
  }

  form p { margin: 0 0 1.1rem 0; }

  form label {
    display: block;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--color-ink-soft);
    margin-bottom: 0.4rem;
  }

  form input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: var(--color-surface);
    color: var(--color-ink);
  }

  form input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(31,111,84,0.14);
  }

  form ul {
    margin: 0.4rem 0 0 0;
    padding-left: 1.1rem;
    font-size: 0.78rem;
    color: var(--color-ink-soft);
  }

  .btn-primary {
    width: 100%;
    padding: 0.75rem;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background 0.15s ease;
  }

  .btn-primary:hover { background: var(--color-primary-dark); }

  .auth-footer {
    margin-top: 1.75rem;
    font-size: 0.88rem;
    color: var(--color-ink-soft);
    text-align: center;
  }

  .auth-footer a {
    color: var(--color-primary);
    font-weight: 500;
    text-decoration: none;
  }

  .form-error {
    background: #FBEAE5;
    border: 1px solid #E3B3A5;
    color: #96361E;
    padding: 0.7rem 0.9rem;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
  }

  @media (max-width: 800px) {
    .auth-shell { grid-template-columns: 1fr; }
    .auth-brand-panel { padding: 2.5rem; min-height: 220px; }
    .auth-brand-panel h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
  <header>
    <a href="/" class="brand">Ledger — Expense Tracker</a>
    <nav>
      {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Daftar</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% if messages %}
    <div style="max-width: 1080px; margin: 1.5rem auto 0 auto; padding: 0 2rem;">
        {% for message in messages %}
        <div style="background: #E8F3EC; border: 1px solid #B8DDC5; color: #14503C; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 0.75rem;">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    {% block content %}{% endblock %}
  </main>
</body>
</html>
