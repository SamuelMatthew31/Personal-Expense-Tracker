{% extends 'base.html' %}
{% block title %}{{ title }} — Ledger{% endblock %}

{% block content %}
<style>
  .form-wrap {
    max-width: 520px;
    margin: 2.5rem auto;
    padding: 0 2rem;
  }
  .form-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 2rem;
  }
  .form-card h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 1.5rem 0;
  }
  .form-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  .btn-secondary {
    padding: 0.7rem 1.2rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-surface);
    color: var(--color-ink-soft);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
  }
  select {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: var(--color-surface);
  }
</style>

<div class="form-wrap">
  <div class="form-card">
    <h1>{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn-primary" style="flex:1;">Simpan</button>
        <a href="{% url 'transaction_list' %}" class="btn-secondary">Batal</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
